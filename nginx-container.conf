server { listen 80; server_name _; root /usr/share/nginx/html; index index.html; charset utf-8; gzip on; gzip_types application/json application/javascript text/css; location / { try_files $uri $uri/ /index.html; } location /data/ { add_header Cache-Control "public, max-age=1800"; } location ~* \.(css|js)$ { expires 1d; add_header Cache-Control "public"; } }