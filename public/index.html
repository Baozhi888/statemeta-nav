<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Baozhi888 的 GitHub Star 与 Fork 仓库分类导航"><title>StateMeta · GitHub 导航</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◈</text></svg>"><link rel="stylesheet" href="/style.css"></head><body><div class="aurora a"></div><div class="aurora b"></div><header><div class="brand"><div class="logo">S</div><div><b>StateMeta</b><span>GitHub Repository Navigator</span></div></div><a class="github" href="https://github.com/Baozhi888" target="_blank" rel="noreferrer">@Baozhi888 ↗</a></header><main><section class="hero"><p class="eyebrow">CURATED · SEARCHABLE · LIVE</p><h1>让每一个好项目<br><em>都触手可及。</em></h1><p class="lead">聚合我的 Stars、Forks 与原创仓库，自动分类、即时搜索，一键直达项目主页。</p><div id="stats" class="stats"><div><strong>—</strong><span>收藏</span></div><div><strong>—</strong><span>仓库</span></div><div><strong>—</strong><span>分类</span></div><div><strong>—</strong><span>Fork</span></div></div></section><section class="panel"><div class="toolbar"><label class="search"><span>⌕</span><input id="q" type="search" placeholder="搜索名称、描述、语言或 Topic…" autocomplete="off"><kbd>/</kbd></label><select id="kind" aria-label="仓库类型"><option value="all">全部类型</option><option value="starred">Starred</option><option value="owned">原创仓库</option><option value="fork">Fork</option></select><select id="sort" aria-label="排序"><option value="relevance">相关 / 更新</option><option value="stars">Star 数</option><option value="updated">最近更新</option><option value="name">名称</option></select></div><div id="categories" class="chips"></div><div class="resultline"><span id="resultCount">正在载入…</span><label><input id="archived" type="checkbox"> 包含归档项目</label></div><div id="grid" class="grid"></div><button id="more" class="more" hidden>加载更多</button></section></main><footer><span>StateMeta © <span id="year"></span></span><span id="updated">数据加载中</span></footer><script src="/app.js"></script></body></html>
